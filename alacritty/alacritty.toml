[window]
opacity = 0.95

[font]
size = 11.0

[font.normal]
family = "IosevkaTerm Nerd Font Mono"
style = "Medium"

[font.bold]
family = "IosevkaTerm Nerd Font Mono"
style = "Bold"

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = '#0f2235'
foreground = '#c4cbd4'
dim_foreground = '#8b9298'
bright_foreground = '#e0e6ec'

[colors.cursor]
text = '#0f2235'
cursor = '#53cafa'

[colors.vi_mode_cursor]
text = '#0f2235'
cursor = '#65acff'

[colors.search.matches]
foreground = '#0f2235'
background = '#53cafa'

[colors.search.focused_match]
foreground = '#0f2235'
background = '#00cc66'

[colors.hints.start]
foreground = '#0f2235'
background = '#ffcc00'

[colors.hints.end]
foreground = '#ffcc00'
background = '#268bd2'

[colors.selection]
text = '#0f2235'
background = '#53cafa'

[colors.normal]
black = '#1e272e'
red = '#dc3232'
green = '#00cc66'
yellow = '#ffcc00'
blue = '#268bd2'
magenta = '#ff33bb'
cyan = '#00ffff'
white = '#c4cbd4'

[colors.bright]
black = '#3d4751'
red = '#ff4d4d'
green = '#00e676'
yellow = '#ffdd33'
blue = '#3399ff'
magenta = '#ff55cc'
cyan = '#33ffff'
white = '#e0e6ec'

[colors.dim]
black = '#151d24'
red = '#9b2c2c'
green = '#00a854'
yellow = '#d4a017'
blue = '#1a5276'
magenta = '#b34792'
cyan = '#008b8b'
