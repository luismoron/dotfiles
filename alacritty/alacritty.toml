[window]
opacity = 0.95

[font]
size = 11.0

[font.normal]
family = "IosevkaTerm Nerd Font Mono"
style = "Medium"

[font.bold]
family = "IosevkaTerm Nerd Font Mono"
style = "Bold"

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = '#0f2235'
foreground = '#c4cbd4'
dim_foreground = '#8b9298'
bright_foreground = '#e0e6ec'

[colors.cursor]
text = '#0f2235'
cursor = '#53cafa'

[colors.vi_mode_cursor]
text = '#0f2235'
cursor = '#65acff'

[colors.search.matches]
foreground = '#0f2235'
background = '#53cafa'

[colors.search.focused_match]
foreground = '#0f2235'
background = '#00cc66'

[colors.hints.start]
foreground = '#0f2235'
background = '#ffcc00'

[colors.hints.end]
foreground = '#ffcc00'
background = '#268bd2'

[colors.selection]
text = '#0f2235'
background = '#53cafa'

[colors.normal]
black = '#1e272e'
red = '#ff4757'
green = '#2ed573'
yellow = '#ffa502'
blue = '#1e90ff'
magenta = '#ff6b9d'
cyan = '#00d2d3'
white = '#c4cbd4'

[colors.bright]
black = '#3d4751'
red = '#ff6b7a'
green = '#7bed9f'
yellow = '#ffeaa7'
blue = '#70a1ff'
magenta = '#ff9ff3'
cyan = '#48dbfb'
white = '#e0e6ec'

[colors.dim]
black = '#151d24'
red = '#9b2c2c'
