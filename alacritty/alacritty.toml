[window]
opacity = 0.85

[font]
size = 11.0

[font.normal]
family = "IosevkaTerm Nerd Font Mono"
style = "Medium"

[font.bold]
family = "IosevkaTerm Nerd Font Mono"
style = "Bold"

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = '#0a1628'
foreground = '#ffffff'
dim_foreground = '#aabbcc'
bright_foreground = '#ffffff'

[colors.cursor]
text = '#0f2235'
cursor = '#53cafa'

[cursor]
style = "Bar"
thickness = 0.15
blink = true

[colors.vi_mode_cursor]
text = '#0f2235'
cursor = '#65acff'

[colors.search.matches]
foreground = '#0f2235'
background = '#53cafa'

[colors.search.focused_match]
foreground = '#0f2235'
background = '#00cc66'

[colors.hints.start]
foreground = '#0f2235'
background = '#ffcc00'

[colors.hints.end]
foreground = '#ffcc00'
background = '#268bd2'

[colors.selection]
text = '#0f2235'
background = '#53cafa'

[colors.normal]
black = '#1a1a2e'
red = '#ff0055'
green = '#00ff88'
yellow = '#ffcc00'
blue = '#00aaff'
magenta = '#ff00ff'
cyan = '#00ffff'
white = '#ffffff'

[colors.bright]
black = '#404060'
red = '#ff3377'
green = '#66ffaa'
yellow = '#ffe066'
blue = '#66ccff'
magenta = '#ff77ff'
cyan = '#66ffff'
white = '#ffffff'

[colors.dim]
black = '#151d24'
red = '#9b2c2c'
green = '#00a854'
yellow = '#d4a017'
blue = '#1a5276'
magenta = '#b34792'
cyan = '#008b8b'
white = '#8b9298'


