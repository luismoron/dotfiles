# Picom configuracion optimizada para AMD APU (Ryzen + Vega integrada)
# Objetivos: zero tearing, maximo rendimiento, minimo consumo

#################################
# Backend
#################################

backend = "glx";
glx-no-stencil = false;
glx-no-rebind-pixmap = true;
use-damage = true;

#################################
# VSync
#################################

vsync = true;
xrender-sync-fence = true;

#################################
# Efectos y opacidades
#################################

active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Sombras desactivadas (ahorro GPU)
shadow = false;

# Fade desactivados (rendimiento)
fading = false;
no-fading-openclose = true;
fade-exclude = [ ];

# Blur hardware (desactivado - consumo alto)
blur-background = false;

#################################
# Optimizaciones rendimiento
#################################

# Solo repintar areas que cambiaron
use-damage = true;

# Desredirigir fullscreen para evitar doble composite
unredir-if-possible = true;

# Paint on overlay puede causar problemas en algunos drivers AMD
paint-on-overlay = false;

# Ignorar root pixmap para reduces rebinds
glx-copy-from-front = false;

#################################
# Compatibilidad
#################################

detect-client-opacity = true;
detect-transient = true;
detect-rounded-corners = true;

# Evitar tearing en aplicaciones fullscreen
detect-fullscreen = true;

#################################
# Reglas de ventanas
#################################

wintypes:
{
    dock = { shadow = false; fade = false; }
    tooltip = { shadow = false; fade = false; }
    popup_menu = { shadow = false; fade = false; }
    dropdown_menu = { shadow = false; fade = false; }
    notification = { shadow = false; fade = false; }
};

#################################
# Exclusiones
#################################

# No aplicar en estas condiciones
corner-radius-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'i3status'",
    "class_g = 'Conky'",
];

# Excluir windows que no deben ser tocadas
force-win-blend = [
    "class_g = 'Alacritty'",
    "class_g = 'Xfce4-terminal'",
];

#################################
# Debug (desactivado)
#################################

log-level = "error";
